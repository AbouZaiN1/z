<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>أبوزين</title>
    <!-- This page carries its own styles and starts its own module, and it
         loads NOTHING else. That duplicates a little of style.css, and it is
         deliberate: every subresource is one more allocation and one more
         timing shift in the process that core.js is about to groom, and this
         exploit is decided by exactly that. The landing page may use the
         shared stylesheet; this one may not. -->
    <style>
      :root {
        --bg: #050301;
        --panel: rgba(24, 13, 2, 0.88);
        --sunk: rgba(10, 5, 1, 0.94);
        --line: #e8ad28;
        --fg: #f1d58c;
        --bright: #fff5d5;
        --dim: #c39a4d;
        --faint: #8a682d;
        --ok: #ffd45a;
        --bad: #ff6860;
        --warn: #ffc247;
        --sans: "Segoe UI", system-ui, sans-serif;
        --mono: Consolas, "DejaVu Sans Mono", monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background:
          radial-gradient(ellipse at 50% 44%, rgba(164, 91, 10, .28) 0%, rgba(77, 39, 4, .13) 30%, transparent 67%),
          radial-gradient(ellipse at 50% 110%, rgba(173, 92, 5, .16), transparent 55%),
          radial-gradient(ellipse at 10% 50%, rgba(122, 70, 10, .12), transparent 38%),
          #050301;
        color: var(--fg);
        font: 15px/1.45 var(--sans);
        overflow-x: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: .6;
        background-image:
          radial-gradient(1px 1px at 8% 17%, #ffe4a0 98%, transparent),
          radial-gradient(1.5px 1.5px at 19% 71%, #ffbd45 98%, transparent),
          radial-gradient(1px 1px at 31% 29%, #fff0c4 98%, transparent),
          radial-gradient(1.5px 1.5px at 43% 82%, #ffca62 98%, transparent),
          radial-gradient(1px 1px at 58% 15%, #ffe4a0 98%, transparent),
          radial-gradient(1.5px 1.5px at 69% 63%, #ffc24d 98%, transparent),
          radial-gradient(1px 1px at 83% 24%, #fff0c4 98%, transparent),
          radial-gradient(1.5px 1.5px at 94% 78%, #ffbd45 98%, transparent);
        background-size: 370px 310px;
      }

      /* --- Matrix Canvas Background --- */
      #matrix {
        position: fixed;
        inset: 0;
        display: block;
        z-index: 1;
        pointer-events: none;
      }

      #brand {
        position: relative;
        z-index: 2;
        padding: 9px 10px;
        border-bottom: 1px solid rgba(226, 171, 54, .48);
        background: linear-gradient(90deg, rgba(15, 8, 1, .72), rgba(68, 37, 5, .72), rgba(15, 8, 1, .72));
        backdrop-filter: blur(7px);
        text-align: center;
        box-shadow: 0 5px 24px rgba(235, 147, 22, .13);
      }
      #brand b {
        color: #ffe1a0;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: .22em;
        text-shadow: 0 0 8px rgba(255, 188, 55, .95), 0 0 22px rgba(255, 146, 0, .65);
      }
      /* The live heap readout sits in the flow under the bar. */
      #ramBox {
        position: relative;
        z-index: 2;
        overflow: hidden;
        padding: 5px 10px;
        border-bottom: 1px solid rgba(221, 163, 43, .34);
        background: rgba(12, 7, 2, .76);
        color: #f6c75b;
        font: 11px/1.4 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Running: a spinner under the bar. jb.js switches the body to .done,
         .fail or .log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid rgba(219, 157, 38, .38);
        border-top-color: #fff0b0;
        border-right-color: #e9a52c;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        box-shadow: 0 0 15px rgba(255, 181, 47, .75), 0 0 34px rgba(255, 128, 0, .3);
        z-index: 5;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        font-size: 16px;
        letter-spacing: .5px;
        z-index: 5;
      }
      #state, #out { display: none; }
      body.done #spin, body.fail #spin { display: none; }
      body.fail #msg { display: block; color: var(--bad); }
      body.done #msg {
        display: block;
        color: var(--ok);
        font-weight: 700;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(255, 194, 69, .9), 0 0 24px rgba(255, 130, 0, .5);
      }
      /* ?log=1 -- the full step log. */
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      body.log #spin, body.log #msg { display: none; }
      body.log #wrap {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 14px 18px 30px;
      }
      body.log #state {
        display: block;
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
        color: var(--bright);
        text-shadow: 0 0 5px rgba(245, 174, 35, .8);
      }
      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 12px;
        border: 1px solid rgba(231, 174, 55, .78);
        border-radius: 10px;
        background: var(--panel);
        backdrop-filter: blur(8px);
        font: 12px/1.45 var(--mono);
        white-space: pre-wrap;
        box-shadow: inset 0 0 22px rgba(224, 145, 24, .19), 0 0 22px rgba(224, 145, 24, .12);
      }
      /* The retry notice, raised by jb.js when the chain throws or stalls. */
      .notice {
        margin: 1em 0;
        padding: .7em 1em;
        border: 2px solid var(--bad);
        border-radius: 8px;
        background: rgba(42, 20, 10, .94);
        color: #ffaaa0;
        font: 700 20px/1.4 var(--sans);
      }
      .byline {
        position: fixed;
        bottom: 9px;
        left: 11px;
        z-index: 9;
        margin: 0;
        color: rgba(225, 174, 79, .65);
        font: 11px/1 var(--mono);
        letter-spacing: .06em;
        text-shadow: 0 0 8px rgba(255, 163, 28, .4);
      }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      .warn { color: var(--warn); }
      code { color: #f5d38c; }

      /* Golden Core decorative background */
      #rain, #core {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #rain { z-index: 1; opacity: .72; }
      #core { z-index: 1; }
      .golden-mark {
        position: fixed;
        left: 50%;
        bottom: 8vh;
        z-index: 3;
        transform: translateX(-50%);
        padding: .45em 1.1em;
        border: 1px solid rgba(255, 204, 51, .42);
        border-radius: 999px;
        background: rgba(20, 10, 1, .55);
        color: #ffdc82;
        font: 12px/1.4 Consolas, "Courier New", monospace;
        letter-spacing: .3em;
        text-transform: uppercase;
        white-space: nowrap;
        backdrop-filter: blur(5px);
        box-shadow: 0 0 18px rgba(255, 169, 32, .15), inset 0 0 12px rgba(255, 190, 70, .08);
        pointer-events: none;
      }
      /* The supplied AbouZain emblem sits over the existing animated sun.
         It is embedded in this document: no extra network request or script. */
      #sunLogo {
        position: fixed;
        left: 50%;
        top: 46%;
        width: clamp(170px, 30vw, 310px);
        height: auto;
        max-height: 34vh;
        object-fit: contain;
        transform: translate(-50%, -50%);
        z-index: 2;
        pointer-events: none;
        mix-blend-mode: screen;
        filter: drop-shadow(0 0 12px rgba(255, 174, 36, .78)) drop-shadow(0 0 30px rgba(255, 122, 0, .42));
      }
      @media (max-width: 600px) {
        #sunLogo { width: clamp(145px, 43vw, 230px); max-height: 27vh; }
        #brand { padding: 7px 8px; }
        #ramBox { font-size: 10px; }
        body.log #wrap { padding: 10px 10px 24px; }
      }
    </style>
  </head>

    <!-- تأثير Golden Core الخلفي؛ لا يتدخل في منطق التنفيذ -->
    <script>
      (() => {
        let W = 0, H = 0, CX = 0, CY = 0;

        function fitCanvas(canvas, ctx) {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          canvas.style.width = W + 'px';
          canvas.style.height = H + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        const rainCanvas = document.getElementById('rain');
        const rctx = rainCanvas.getContext('2d');
        const GLYPHS =
          'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン' +
          '0123456789';

        const FONT_SIZE = 17;
        let columns = 0;
        let drops = [];
        let speeds = [];

        function resizeRain() {
          const newColumns = Math.ceil(W / FONT_SIZE);
          const newDrops = new Array(newColumns);
          const newSpeeds = new Array(newColumns);
          for (let i = 0; i < newColumns; i++) {
            newDrops[i] = drops[i] !== undefined ? drops[i] : Math.floor(Math.random() * -50);
            newSpeeds[i] = speeds[i] !== undefined ? speeds[i] : 0.25 + Math.random() * 0.55;
          }
          drops = newDrops;
          speeds = newSpeeds;
          columns = newColumns;
          rctx.fillStyle = '#030200';
          rctx.fillRect(0, 0, W, H);
        }

        function drawRain() {
          rctx.fillStyle = 'rgba(3, 2, 0, 0.08)';
          rctx.fillRect(0, 0, W, H);
          rctx.font = `${FONT_SIZE}px Consolas, "Courier New", monospace`;
          rctx.textAlign = 'center';
          const coreRadiusInfluence = Math.min(W, H) * 0.32;

          for (let i = 0; i < columns; i++) {
            const x = i * FONT_SIZE + FONT_SIZE / 2;
            const y = drops[i] * FONT_SIZE;
            const glyph = GLYPHS[(Math.random() * GLYPHS.length) | 0];
            const dx = x - CX;
            const nearCore = Math.max(0, 1 - Math.abs(dx) / coreRadiusInfluence);

            if (y > 0) {
              const headAlpha = 0.85 + nearCore * 0.15;
              rctx.fillStyle = nearCore > 0.5
                ? `rgba(255, 244, 214, ${headAlpha})`
                : `rgba(255, 215, 0, ${headAlpha})`;
              rctx.shadowColor = '#ffcc33';
              rctx.shadowBlur = 6 + nearCore * 10;
              rctx.fillText(glyph, x, y);
              rctx.shadowBlur = 0;

              if (y - FONT_SIZE > 0) {
                rctx.fillStyle = `rgba(201, 149, 12, ${0.55 + nearCore * 0.25})`;
                rctx.fillText(GLYPHS[(Math.random() * GLYPHS.length) | 0], x, y - FONT_SIZE);
              }
            }

            const fallSpeed = speeds[i] * (1 - nearCore * 0.6);
            drops[i] += Math.max(fallSpeed, 0.08);
            if (y > H && Math.random() > 0.98) {
              drops[i] = Math.floor(Math.random() * -40);
              speeds[i] = 0.25 + Math.random() * 0.55;
            }
          }
        }

        const coreCanvas = document.getElementById('core');
        const cctx = coreCanvas.getContext('2d');
        let t = 0;
        let embers = [];

        function spawnEmber(radius) {
          return {
            angle: Math.random() * Math.PI * 2,
            radius,
            speed: 18 + Math.random() * 34,
            drift: (Math.random() - 0.5) * 0.4,
            size: 1 + Math.random() * 2,
            life: 0,
            maxLife: 2.5 + Math.random() * 2.5
          };
        }

        function resizeCore() {
          CX = W / 2;
          CY = H * 0.46;
        }

        function drawCore(dt) {
          cctx.clearRect(0, 0, W, H);
          const baseRadius = Math.min(W, H) * 0.09;
          const pulse = 1 + Math.sin(t * 1.3) * 0.06;
          const r = baseRadius * pulse;

          const ambient = cctx.createRadialGradient(CX, CY, 0, CX, CY, r * 6);
          ambient.addColorStop(0, 'rgba(255, 149, 0, 0.35)');
          ambient.addColorStop(0.35, 'rgba(255, 149, 0, 0.12)');
          ambient.addColorStop(1, 'rgba(255, 149, 0, 0)');
          cctx.fillStyle = ambient;
          cctx.fillRect(0, 0, W, H);

          const rayCount = 48;
          const rayPulse = 1 + Math.sin(t * 0.9) * 0.18;
          for (let i = 0; i < rayCount; i++) {
            const a = (i / rayCount) * Math.PI * 2 + t * 0.05;
            const jitter = Math.sin(t * 2 + i) * 0.15 + 1;
            const len = r * (2.1 + (i % 5) * 0.35) * rayPulse * jitter;
            const x1 = CX + Math.cos(a) * r * 1.02;
            const y1 = CY + Math.sin(a) * r * 1.02;
            const x2 = CX + Math.cos(a) * len;
            const y2 = CY + Math.sin(a) * len;
            const grad = cctx.createLinearGradient(x1, y1, x2, y2);
            grad.addColorStop(0, 'rgba(255, 204, 51, 0.55)');
            grad.addColorStop(1, 'rgba(255, 204, 51, 0)');
            cctx.strokeStyle = grad;
            cctx.lineWidth = i % 4 === 0 ? 1.6 : 0.8;
            cctx.beginPath();
            cctx.moveTo(x1, y1);
            cctx.lineTo(x2, y2);
            cctx.stroke();
          }

          [
            { mult: 1.5, speed: 0.4, width: 1.4, dash: [2, 10] },
            { mult: 1.9, speed: -0.27, width: 1, dash: [6, 14] }
          ].forEach(ring => {
            cctx.save();
            cctx.translate(CX, CY);
            cctx.rotate(t * ring.speed);
            cctx.beginPath();
            cctx.setLineDash(ring.dash);
            cctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
            cctx.lineWidth = ring.width;
            cctx.arc(0, 0, r * ring.mult, 0, Math.PI * 2);
            cctx.stroke();
            cctx.restore();
          });

          const core = cctx.createRadialGradient(
            CX - r * 0.25, CY - r * 0.25, r * 0.05,
            CX, CY, r
          );
          core.addColorStop(0, '#fff4d6');
          core.addColorStop(0.45, '#ffcc33');
          core.addColorStop(1, '#b8860b');
          cctx.fillStyle = core;
          cctx.beginPath();
          cctx.arc(CX, CY, r, 0, Math.PI * 2);
          cctx.fill();

          cctx.save();
          cctx.globalCompositeOperation = 'screen';
          cctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
          cctx.beginPath();
          cctx.arc(CX, CY, r * 1.08, 0, Math.PI * 2);
          cctx.fill();
          cctx.restore();

          if (Math.random() > 0.65) embers.push(spawnEmber(r));
          embers.forEach(e => {
            e.life += dt;
            e.angle += e.drift * dt;
            e.radius += e.speed * dt;
          });
          embers = embers.filter(e => e.life < e.maxLife);
          embers.forEach(e => {
            const fade = 1 - e.life / e.maxLife;
            const ex = CX + Math.cos(e.angle) * e.radius;
            const ey = CY + Math.sin(e.angle) * e.radius;
            cctx.fillStyle = `rgba(255, 220, 150, ${fade * 0.8})`;
            cctx.beginPath();
            cctx.arc(ex, ey, e.size * fade, 0, Math.PI * 2);
            cctx.fill();
          });
        }

        function resizeAll() {
          W = window.innerWidth;
          H = window.innerHeight;
          fitCanvas(rainCanvas, rctx);
          fitCanvas(coreCanvas, cctx);
          resizeCore();
          resizeRain();
        }

        window.addEventListener('resize', resizeAll);
        resizeAll();

        let last = performance.now();
        function loop(now) {
          const dt = Math.min((now - last) / 1000, 0.05);
          last = now;
          t += dt;
          drawRain();
          drawCore(dt);
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      })();
    </script>

    <script type="module">
      import "./jb.js";
    </script>
  </body>
</html>
